<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Все Person</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn-edit {
            background: #2196F3;
            color: white;
            padding: 5px 10px;
            text-decoration: none;
            border-radius: 3px;
        }
        .btn-edit:hover { background: #1976D2; }
        .btn-delete {
            background: #f44336;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 3px;
        }
        .btn-delete:hover { background: #d32f2f; }
        .form-inline { display: inline; }
    </style>
</head>
<body>
<h1>Все Person</h1>
<a href="/persons/new">➕ Добавить нового</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Возраст</th>
        <th>Email</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="person : ${persons}">
        <td th:text="${person.id}"></td>
        <td th:text="${person.name}"></td>
        <td th:text="${person.age}"></td>
        <td>

            <a th:href="@{/persons/{id}/edit(id=${person.id})}" class="btn-edit">✏️ Редактировать</a>

            <form th:action="@{/persons/{id}(id=${person.id})}" method="post" class="form-inline">
                <input type="hidden" name="_method" value="DELETE"/>
                <button type="submit" class="btn-delete" onclick="return confirm('Удалить?')">
                    🗑️ Удалить
                </button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
